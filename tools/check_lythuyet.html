<!doctype html>
<meta charset="utf-8">
<title>Kiểm tra bài giảng</title>
<!-- Mở qua máy chủ cục bộ: /tools/check_lythuyet.html — kiểm tra mọi bài giảng đã gắn: công thức KaTeX, ảnh, cú pháp khối. -->
<body style="font-family:sans-serif">
<pre id="out">Đang kiểm tra…</pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script>
(async () => {
  const html = await (await fetch('../index.html', { cache: 'no-cache' })).text();
  const data = JSON.parse(html.match(/let data = (\{.*?\});\n/s)[1]);
  const mds = data.theory.filter(x => x.md).map(x => x.md);
  const lines = [];
  let bad = 0;
  for (const md of mds) {
    const src = await (await fetch('../' + md, { cache: 'no-cache' })).text();
    const base = '../' + md.replace(/[^/]*$/, '');
    const errs = [];
    const math = [...src.matchAll(/\$\$([\s\S]+?)\$\$/g)].map(m => [m[1], true])
      .concat([...src.replace(/\$\$[\s\S]+?\$\$/g, '').matchAll(/\$([^\n$]+?)\$/g)].map(m => [m[1], false]));
    for (const [tex, d] of math) {
      try { katex.renderToString(tex, { displayMode: d, throwOnError: true, strict: 'ignore' }); }
      catch (e) { errs.push('TeX: ' + tex.slice(0, 50) + ' → ' + e.message.slice(0, 90)); }
    }
    for (const m of src.matchAll(/!\[[^\]]*\]\(([^)\s]+)\)/g)) {
      const r = await fetch(base + m[1], { method: 'HEAD' });
      if (!r.ok) errs.push('Thiếu ảnh: ' + m[1]);
    }
    const open = (src.match(/^\s*:::\w+/gm) || []).length, close = (src.match(/^\s*:::\s*$/gm) || []).length;
    if (open !== close) errs.push(`Khối ::: mở ${open} / đóng ${close}`);
    if (/\t/.test(src)) errs.push('Có ký tự tab');
    if (errs.length) bad++;
    lines.push((errs.length ? '✗ ' : '✓ ') + md + ` (${math.length} công thức)` + (errs.length ? '\n   ' + errs.join('\n   ') : ''));
  }
  document.getElementById('out').textContent = `${mds.length} bài, ${bad} bài có lỗi\n\n` + lines.join('\n');
  window.RESULT = { total: mds.length, bad };
})();
</script>
